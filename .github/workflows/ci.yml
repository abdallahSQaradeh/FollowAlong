name: CI

on:
  pull_request:
    branches: [main, 'integration/**']
  push:
    branches: [main, 'integration/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  FORCE_COLOR: '1'

jobs:
  ubuntu:
    name: ubuntu (verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Cache VS Code for the smoke test
        uses: actions/cache@v5
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: npm run verify (format, lint, types, unit, player, smoke under xvfb, check-logs)
        run: npm run verify

      - name: check-logs (also after a failed step)
        if: always()
        run: npm run check-logs

      - name: Upload .logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logs-ubuntu
          path: .logs/
          include-hidden-files: true
          if-no-files-found: ignore

  ffmpeg:
    name: ffmpeg (build the bundled LGPL ffmpeg.exe)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Find the mingw-w64 version the build would use
        id: mingw
        run: |
          sudo apt-get update
          version="$(apt-cache policy gcc-mingw-w64-x86-64-posix | sed -n 's/^ *Candidate: //p')"
          echo "mingw-w64 compiler: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The key holds everything the binary depends on: the build script, the pinned versions,
      # checksums and configure flags, and the cross-compiler's version. Change one, and it is
      # built again (ADR 0070).
      - name: Restore the built ffmpeg
        id: cache
        uses: actions/cache@v5
        with:
          path: bin
          key: ffmpeg-win32-x64-${{ steps.mingw.outputs.version }}-${{ hashFiles('scripts/build-ffmpeg.mjs', 'scripts/bundled-ffmpeg.json') }}

      - name: Install the cross-compiler and nasm (to build)
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 make nasm xz-utils

      - name: Install objdump (to check what is cached)
        if: steps.cache.outputs.cache-hit == 'true'
        run: sudo apt-get install -y --no-install-recommends binutils-mingw-w64-x86-64

      - name: Build ffmpeg.exe from the pinned sources
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          BUILD_JOBS: '4'
        run: node scripts/build-ffmpeg.mjs

      - name: Show what was built, and that it needs no DLL outside Windows
        run: |
          ls -l bin
          cat bin/FFMPEG-BUILD.txt
          node scripts/build-ffmpeg.mjs --check-imports bin/ffmpeg.exe

      - name: Upload ffmpeg-win32-x64
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-win32-x64
          path: bin/
          if-no-files-found: error

  windows:
    name: windows (typecheck, unit, smoke, bundled ffmpeg, package)
    needs: ffmpeg
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download the built ffmpeg
        uses: actions/download-artifact@v6
        with:
          name: ffmpeg-win32-x64
          path: bin

      - name: Cache VS Code for the smoke test
        uses: actions/cache@v5
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ hashFiles('package.json') }}

      - run: npm run typecheck

      - run: npm run test

      - run: npm run test:smoke

      - name: check-logs
        if: always()
        run: npm run check-logs

      - name: Package the .vsix
        run: npm run package

      - name: The .vsix holds ffmpeg.exe, its licences and its source offer
        shell: bash
        run: |
          tar -tf ./*.vsix | tee vsix-files.txt
          for file in extension/bin/ffmpeg.exe extension/bin/FFMPEG-LICENSE-LGPL-2.1.txt \
            extension/bin/LAME-LICENSE-LGPL.txt extension/bin/FFMPEG-BUILD.txt \
            extension/scripts/build-ffmpeg.mjs extension/scripts/bundled-ffmpeg.json \
            extension/THIRD_PARTY_NOTICES.txt; do
            grep -qxF "$file" vsix-files.txt || { echo "::error::$file is not in the .vsix"; exit 1; }
          done

      # The file that ships, run from the unpacked .vsix: the LGPL gate (ffmpeg -L and -buildconf),
      # then the extension's own converter adapter turns the AAC sound of an MP4 into an MP3.
      - name: Run the ffmpeg.exe from the .vsix (LGPL gate, AAC to MP3 through the converter adapter)
        shell: bash
        run: |
          mkdir vsix-unpacked
          tar -xf ./*.vsix -C vsix-unpacked
          node scripts/check-bundled-ffmpeg.mjs vsix-unpacked/extension/bin/ffmpeg.exe

      - name: Upload .vsix
        uses: actions/upload-artifact@v6
        with:
          name: followalong-vsix
          path: '*.vsix'
          if-no-files-found: ignore

      - name: Upload .logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logs-windows
          path: .logs/
          include-hidden-files: true
          if-no-files-found: ignore
